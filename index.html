  ["Grove", "Trains foals, and greens the land around it. +16 herd. Lose every grove and you are out."],
  ["Stable", "Trains chargers, heavy melee that tramples foals. +12 herd."],
  ["Spire", "Trains prisms, long reach. Blooms a wide ring of land on its own. +10 herd."],
];

const elHud = el("hud"), elRes = el("res"), elBar = el("bar"), elObj = el("obj");
const elBuild = el("build"), elVeil = el("veil"), elCard = el("card");

// One segment per herd, with blight showing through as the bar's own background.
// This is the score. The game is about who holds the most ground, so the score is
// a picture of the ground.
const segs = HERDS.map((h) => {
  const d = document.createElement("div");
  d.style.background = "rgb(" + h.rgb.join(",") + ")";
  elBar.appendChild(d);
  return d;
});

const costEls = [];
const btns = BLURB.map(([name, desc], i) => {
  const d = document.createElement("div");
  const head = document.createElement("b");
  const price = document.createElement("u");
  const body = document.createElement("i");
  d.className = "b";
  head.textContent = (i + 1) + "  " + name + "   ";
  body.textContent = desc;
  head.appendChild(price);
  d.appendChild(head);
  d.appendChild(body);
  d.onclick = () => {
    audioInit();
    choice = choice === i ? -1 : i;
  };
  elBuild.appendChild(d);
  costEls.push(price);
  return d;
});

function card(html, cls) {
  elCard.innerHTML = html;
  elVeil.className = cls || "";
  // The playing HUD belongs to the game, not to whatever menu is in front of it.
  elHud.style.opacity = elBuild.style.opacity = "0";
}

// Rival shares, phrased for a sentence.
function rivalShares() {
  const parts = [];
  for (let h = 1; h < herdCount; h++) parts.push(HERDS[h].name + " " + share(h) + "%");
  return parts.join(", ");
}

const KEYS = "<p class=keys>drag to select &middot; right click to move &middot; " +
  "<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> build &middot; " +
  "<kbd>wheel</kbd> zoom &middot; <kbd>,</kbd><kbd>.</kbd> speed &middot; " +
  "<kbd>esc</kbd> pause &middot; <kbd>m</kbd> mute</p>";

// The lobby. What's behind it is the map you're about to play, so the panel sits
// off to one side and the veil is thin. Change opponents or roll a new continent
// and it regenerates in place while you watch.
let seed = 1337;

function showMenu() {
  state = MENU;
  const swatch = (h) => "<span class=sw style=background:rgb(" + HERDS[h].rgb.join(",") + ")></span>";
  let rivals = "";
  for (let h = 1; h < herdCount; h++) rivals += swatch(h);

  card(
    "<h1>bloomfront</h1>" +
    "<p>The continent is blighted. <em>Where your herd walks, it comes back to life " +
    "in your colour.</em></p>" +
    "<p>Bloom trickles in from every living tile you hold, and living ground is the " +
    "only ground you can build on. Buildings train unicorns free, and set how large " +
    "a herd you can keep, so bloom is spent on buildings alone.</p>" +
    "<p class=row><b>Opponents</b>" +
    [1, 2, 3].map((n) =>
      "<button class='pick" + (herdCount - 1 === n ? " sel" : "") + "' data-n=" + n + ">" +
      n + "</button>").join("") +
    "</p>" +
    "<p class=row><b>Herds</b>" + swatch(0) + "<i>you</i>" + rivals + "</p>" +
    "<p class=row><b>Herd size</b>" +
    POPS.map((n, i) =>
      "<button class='pick" + (popIdx === i ? " sel" : "") + "' data-p=" + i + ">" +
      n + "</button>").join("") +
    "</p>" +
    "<p class=row><b>Speed</b>" +
    SPEEDS.map((r, i) =>
      "<button class='pick" + (speed === i ? " sel" : "") + "' data-s=" + i + ">" +
      r[0] + "</button>").join("") +
    "</p>" +
    "<p class=row><b>Rivals</b>" +
    RIVALS.map((r, i) =>
      "<button class='pick" + (difficulty === i ? " sel" : "") + "' data-r=" + i + ">" +
      r[0] + "</button>").join("") +
    "</p>" +
    "<p class=row><b>Victory</b>" +
    "<button class='pick" + (winDominion ? " sel" : "") + "' data-w=d>Dominion " +
    (goalShare() * 100).toFixed(0) + "%</button>" +
    "<button class='pick" + (winConquest ? " sel" : "") + "' data-w=c>Conquest</button>" +
    "</p>" +
    "<p class=rules>You are the " + HERDS[0].name + " herd. " + winText() + "</p>" +
    KEYS +
    "<button id=go>Begin</button>" +
    "<button id=roll class=ghost>New world</button>" +
    "<span class=seed>seed " + seed + "</span>",
    "lobby"
  );

  el("go").onclick = () => { audioInit(); play(); };
  el("roll").onclick = () => { seed = (Math.random() * 1e9) | 0; preview(); };
  for (const b of elCard.querySelectorAll(".pick")) {
    b.onclick = () => {
      if (b.dataset.n) {
        herdCount = +b.dataset.n + 1;
        preview();
        return;
      }
      if (b.dataset.r) {
        difficulty = +b.dataset.r;
        preview();
        return;
      }
      if (b.dataset.s) {
        speed = +b.dataset.s;
        showMenu();
        return;
      }
      if (b.dataset.p) {
        popIdx = +b.dataset.p;
        showMenu();
        return;
      }
      // Toggling a route only needs the panel redrawn, not a new world. Can't
      // switch off the last one or nothing would ever end the game.
      if (b.dataset.w === "d") {
        if (winDominion && !winConquest) return;
        winDominion = !winDominion;
      } else {
        if (winConquest && !winDominion) return;
        winConquest = !winConquest;
      }
      showMenu();
    };
  }
}

// How this game gets won, in a sentence, depending on what's on.
function winText() {
  const dom = "hold <em>" + (goalShare() * 100).toFixed(0) + "% of the continent</em>, " +
    "an even share and a little more";
  const con = "raze every rival grove";
  if (winDominion && winConquest) return "Win by either: " + dom + ", or " + con + ".";
  if (winDominion) {
    return "Win by dominion only: " + dom + ". Groves are just buildings here, so a " +
      "herd that loses them all fights on from its stables and spires.";
  }
  return "Win by conquest only: " + con + ", and lose if you lose your own. " +
    "Ground is worth holding for the bloom it pays, but it will not win the game.";
}

// New world under the lobby, panel redrawn, without leaving it.
function preview() {
  begin(seed, true);
  showMenu();
}

function play() {
  // Drop from the wide preview down onto your home.
  cam.x = worldX(homes[0][0], homes[0][1]);
  cam.y = worldY(homes[0][0], homes[0][1], elev[at(homes[0][0], homes[0][1])]);
  cam.z = 1.7;
  resume();
}

function showPause() {
  state = PAUSED;
  card(
    "<h2>Paused</h2>" +
    "<p>You hold <em>" + share(0) + "%</em> of the continent" +
    (winDominion ? ", and need " + (goalShare() * 100).toFixed(0) + "%" : "") +
    ". The rivals hold " + rivalShares() + ".</p>" +
    KEYS +
    "<button id=go>Resume</button>" +
    "<button id=re class=ghost>Restart</button>" +
    "<button id=lob class=ghost>Lobby</button>"
  );
  el("go").onclick = resume;
  el("re").onclick = () => { seed = (Math.random() * 1e9) | 0; begin(seed); play(); };
  el("lob").onclick = () => { begin(seed); showMenu(); };
}

function showOver(won) {
  state = ENDED;
  const razed = won && winConquest && !buildings.some((b) => b.herd !== 0 && b.type === GROVE);
  card(
    "<h2>" + (won
      ? (razed ? "Every rival grove has fallen" : "The continent is yours")
      : "Your last grove has fallen") + "</h2>" +
    "<p>" + (won
      ? "You brought <em>" + share(0) + "%</em> of the blighted land back to life."
      : "The herd is scattered. The rivals hold " + rivalShares() + ".") +
    "</p>" +
    "<button id=re>Play again</button>" +
    "<button id=lob class=ghost>Lobby</button>"
  );
  el("re").onclick = () => { seed = (Math.random() * 1e9) | 0; begin(seed); play(); };
  el("lob").onclick = () => { begin(seed); showMenu(); };
}

function resume() {
  state = PLAY;
  elVeil.className = "hide";
  elHud.style.opacity = elBuild.style.opacity = "1";
}

function share(h) {
  return (territory[h] / Math.max(1, landTiles) * 100).toFixed(1);
}

function updateHud() {
  const goal = (goalShare() * 100).toFixed(0);
  elRes.textContent = "bloom " + (purse[0] | 0) +
    "  +" + (territory[0] * INCOME).toFixed(1) + "/s" +
    "      herd " + pop[0] + "/" + cap[0] +
    "      land " + share(0) + "%" + (winDominion ? " of " + goal + "%" : "") +
    (speed === 1 ? "" : "      " + SPEEDS[speed][0]);
  for (let h = 0; h < HERDS.length; h++) {
    segs[h].style.width = h < herdCount
      ? (territory[h] / Math.max(1, landTiles) * 100).toFixed(2) + "%"
      : "0";
  }

  // Hint answers whatever hasn't been done yet, in order. Judges give this about
  // five minutes, so the first ninety seconds have to explain themselves.
  let hint;
  if (choice >= 0) {
    hint = "Click the highlighted ground to place the " + BLURB[choice][0].toLowerCase() +
      ". It needs a flat 2x2 of land you have already brought to life.";
  } else if (!units.some((u) => u.herd === 0 && u.field)) {
    hint = "Drag a box over your unicorns, then right click on grey ground. " +
      "They bring it back to life by standing on it.";
  } else if (purse[0] >= BUILD[STABLE].c) {
    hint = "You have bloom to spend. Press 1, 2 or 3 to build. " +
      "Buildings raise how large a herd you can keep.";
  } else if (pop[0] >= cap[0]) {
    hint = "Your herd is at its limit. Build to raise it.";
  } else {
    hint = "Bloom trickles in from every living tile you hold. Spread out to earn more.";
  }
  elObj.textContent = hint;

  for (let i = 0; i < btns.length; i++) {
    const price = costOf(0, i);
    costEls[i].textContent = price;
    btns[i].className = "b" + (choice === i ? " on" : "") + (purse[0] < price ? " no" : "");
  }
}

// --- who has won ---------------------------------------------------------------

// Two routes to victory, either switchable off in the lobby, both open to the
// rivals as well.
//
// Conquest on, a herd that loses every grove is out. Conquest off, groves are
// just buildings and a herd without one keeps training from stables and spires,
// leaving ground to decide it. One route is always on, or nothing ends.
let winDominion = true;
let winConquest = true;

function judge() {
  if (winConquest) {
    const groves = HERDS.map(() => 0);
    for (const b of buildings) if (b.type === GROVE) groves[b.herd]++;
    if (!groves[0]) return -1;
    let rivalGroves = 0;
    for (let h = 1; h < herdCount; h++) rivalGroves += groves[h];
    if (!rivalGroves) return 1;
  }

  if (winDominion) {
    const need = landTiles * goalShare();
    if (territory[0] >= need) return 1;
    for (let h = 1; h < herdCount; h++) if (territory[h] >= need) return -1;
  }

  return 0;
}

// --- loop ----------------------------------------------------------------------

let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === PLAY) {
    // Panning stays off the speed multiplier. Controls should feel the same
    // however fast the world is running.
    const pan = 900 * dt / cam.z;
    if (keys.has("a") || keys.has("arrowleft")) cam.x -= pan;
    if (keys.has("d") || keys.has("arrowright")) cam.x += pan;
    if (keys.has("w") || keys.has("arrowup")) cam.y -= pan;
    if (keys.has("s") || keys.has("arrowdown")) cam.y += pan;

    hover = pick(...toWorld(mouseX, mouseY));

    const sdt = dt * SPEEDS[speed][1];
    voices = 0;
    stepUnits(sdt);
    economy(sdt);
    for (let h = 1; h < herdCount; h++) think(h, sdt);
    music(sdt);
    updateHud();

    const verdict = judge();
    if (verdict) showOver(verdict > 0);
  }

  render();
  requestAnimationFrame(frame);
}

// --- start ---------------------------------------------------------------------


function goodHome(x, y, taken, gap) {
  if (!inMap(x, y) || !inMap(x + 1, y + 1)) return false;
  const i = at(x, y);
  if (kind[i] === WATER || elev[i] >= LEVELS - 1) return false;
  // The home tile has to be a legal footprint in its own right, so the opening
  // grove is guaranteed somewhere to stand once the ground is bloomed. Picking a
  // home and hoping a flat 2x2 turns up nearby falls over on rough seeds.
  for (let dy = 0; dy < 2; dy++) {
    for (let dx = 0; dx < 2; dx++) {
      const j = at(x + dx, y + dy);
      if (kind[j] === WATER || elev[j] !== elev[i]) return false;
    }
  }
  // No two herds opening on top of each other.
  for (const t of taken) if (Math.hypot(t[0] - x, t[1] - y) < gap) return false;
  return true;
}

// Herds spread evenly round the middle of the continent. Walking in along a spoke
// finds ground on nearly every seed, but not all: a spoke can run over water the
// whole way, or over nothing but the top terrace. The spiral is the fallback, and
// it always comes back with a home, because a herd without one has no grove and
// loses the moment the game starts.
function pickHomes() {
  const out = [];
  for (let h = 0; h < herdCount; h++) {
    const ang = (h / herdCount) * Math.PI * 2 - Math.PI / 2;
    const cx = Math.round(MAP / 2 + Math.cos(ang) * MAP * 0.3);
    const cy = Math.round(MAP / 2 + Math.sin(ang) * MAP * 0.3);
    let best = null;

    // Preferred spacing first, then progressively closer. A cramped continent
    // still has to seat everybody. The floor stays well above the opening bloom
    // radius: any closer and the second herd finds its ground already owned by
    // the first and can't place a grove.
    for (const gap of [MAP * 0.22, MAP * 0.16, MAP * 0.12, MAP * 0.10]) {
      for (let d = 0.40; d >= 0 && !best; d -= 0.02) {
        const x = Math.round(MAP / 2 + Math.cos(ang) * MAP * d);
        const y = Math.round(MAP / 2 + Math.sin(ang) * MAP * d);
        if (goodHome(x, y, out, gap)) best = [x, y];
      }
      for (let r = 1; r < MAP && !best; r++) {
        for (let a = 0; a < 32 && !best; a++) {
          const t = a / 32 * Math.PI * 2;
          const x = Math.round(cx + Math.cos(t) * r);
          const y = Math.round(cy + Math.sin(t) * r);
          if (goodHome(x, y, out, gap)) best = [x, y];
        }
      }
      if (best) break;
    }

    out.push(best || [MAP >> 1, MAP >> 1]);
  }
  return out;
}

// First grove goes on the nearest legal footprint to home, searched in rings
// rather than assumed, since whether a flat 2x2 exists anywhere depends on the
// map.
function seedGrove(h, hx, hy) {
  for (let r = 0; r < 16; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        if (canPlace(h, hx + dx, hy + dy)) return place(h, GROVE, hx + dx, hy + dy);
      }
    }
  }
  // goodHome already guaranteed this tile is a legal footprint, so the only way
  // to land here is ground a neighbour claimed first. Take it back rather than
  // leave a herd with no centre and an instant loss it never earned.
  for (let dy = 0; dy < 2; dy++) {
    for (let dx = 0; dx < 2; dx++) {
      const i = at(hx + dx, hy + dy);
      own[i] = h;
      vit[i] = 1;
    }
  }
  return place(h, GROVE, hx, hy);
}

let homes = [];

// Per game rather than per session. Sprite atlases are built once and survive a
// restart. The world doesn't.
function begin(seed) {
  vit.fill(0);
  own.fill(0);
  occupied.fill(0);
  units.length = 0;
  buildings.length = 0;
  shots.length = 0;
  fieldCache.clear();
  territory.fill(0);
  for (let h = 0; h < HERDS.length; h++) {
    brains[h] = h && h < herdCount
      ? { t: RIVALS[difficulty][1] + h * 1.5, wave: RIVALS[difficulty][2] }
      : null;
  }
  slowT = 0;
  choice = -1;

  generate(seed);
  homes = pickHomes();

  for (let h = 0; h < herdCount; h++) {
    purse[h] = 100;
    bloomAt(homes[h][0], homes[h][1], h, 1, 6);
    seedGrove(h, homes[h][0], homes[h][1]);

    // Starting herd, seated on walkable ground round the home. Collect the open
    // ground first and deal it out, rather than each unicorn hunting for itself.
    // Sampling per unit comes up short on a cramped home and the herd quietly
    // starts one or two light. Separation untangles anything sharing a tile on
    // the first tick.
    const roster = [FOAL, FOAL, FOAL, FOAL, FOAL, FOAL, CHARGER, CHARGER, PRISM, PRISM];
    const spots = [];
    for (let r = 1; r < 30 && spots.length < 60; r++) {
      for (let a = 0; a < r * 8; a++) {
        const t = a / (r * 8) * Math.PI * 2;
        const x = Math.round(homes[h][0] + Math.cos(t) * r);
        const y = Math.round(homes[h][1] + Math.sin(t) * r);
        if (walkable(x, y)) spots.push([x + 0.5, y + 0.5]);
      }
    }
    for (let n = 0; n < roster.length; n++) {
      const s = spots.length ? spots[(n * 7) % spots.length] : [homes[h][0] + 0.5, homes[h][1] + 0.5];
      spawn(h, roster[n], s[0] + (Math.random() - 0.5) * 0.6, s[1] + (Math.random() - 0.5) * 0.6);
    }
  }

  // Wide on the middle of the continent for the lobby preview. play() drops it
  // onto your home when the game actually starts.
  cam.x = worldX(MAP / 2, MAP / 2);
  cam.y = worldY(MAP / 2, MAP / 2, 2);
  cam.z = 0.62;

  updateHud();
}

buildTiles();
buildUnits();
buildBuildings();
resize();

// World first, since the lobby draws it.
begin(seed);
showMenu();

requestAnimationFrame(frame);

</script>
</body>
</html>
